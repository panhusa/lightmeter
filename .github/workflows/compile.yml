name: Compile

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:nano
          sketch-paths: |
            - src/lightmeter
          libraries: |
            - name: BH1750
              version: 1.3.0
            - name: Adafruit SSD1306
            - name: Adafruit GFX Library
          enable-warnings-report: true
